name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ami_test:ami_test@localhost:5432/ami_test?schema=public
      AMI_TEST_DATABASE_URL: postgresql://ami_test:ami_test@localhost:5432/ami_test?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ami_test
          POSTGRES_PASSWORD: ami_test
          POSTGRES_DB: ami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ami_test -d ami_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe resume diagnostics
        run: |
          bash -n scripts/check-resume-readonly.sh
          bash -n scripts/test-resume-preflight.sh
          bash scripts/test-resume-preflight.sh
      - name: Verify documentation links
        run: |
          python3 scripts/check-doc-links.py
          python3 scripts/test-doc-links.py
      - name: Verify documentation editorial standards and OpenAPI structure
        run: |
          python3 scripts/check-doc-editorial.py
          python3 scripts/test-doc-editorial.py
      - name: Verify documentation boundaries
        run: |
          python3 scripts/check-doc-structure.py
          python3 scripts/test-doc-structure.py
      - name: Protect private backup and canonical-source filenames
        run: |
          python3 scripts/check-tracked-private-files.py
          python3 scripts/test-tracked-private-files.py
      - name: Check private Ollama recovery safety
        run: |
          bash -n scripts/prepare-pinned-local-ollama.sh
          bash -n scripts/test-pinned-ollama-prep.sh
          bash scripts/test-pinned-ollama-prep.sh
      - name: Check warmed model recheck safety
        run: |
          bash -n scripts/recheck-warm-local-ai.sh
          bash -n scripts/test-warm-ai-recheck.sh
          bash scripts/test-warm-ai-recheck.sh
      - name: Check seven-session local AI guard semantics
        run: |
          bash -n scripts/test-local-ai-session-gates.sh
          bash scripts/test-local-ai-session-gates.sh
      - name: Check API-only activation safety
        run: |
          bash -n scripts/activate-verified-local-ai.sh
          bash -n scripts/test-activate-verified-local-ai.sh
          bash scripts/test-activate-verified-local-ai.sh
      - name: Check end-of-day safe backup and pause
        run: |
          bash -n scripts/pause-cloud-shell-safely.sh
          bash -n scripts/test-pause-cloud-shell-safely.sh
          bash scripts/test-pause-cloud-shell-safely.sh
      - name: Check read-only resumed QA metrics safety
        run: |
          bash -n scripts/qa-readonly-resumed-metrics.sh
          bash -n scripts/test-qa-readonly-resumed-metrics.sh
          bash scripts/test-qa-readonly-resumed-metrics.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard Vercel Services private routing
        run: node scripts/test-vercel-services-config.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ami-108/api exec prisma validate
      - run: pnpm db:generate
      - name: Validate manual Production migration guards without connecting
        run: pnpm --filter @ami-108/api exec node scripts/test-production-schema-preflight.cjs
      - run: pnpm --filter @ami-108/api exec prisma migrate deploy
      - run: pnpm --filter @ami-108/api exec prisma migrate status
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/smoke-chapter-one.mjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app tests
      - run: uv run --locked pytest

  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative secret detectors
        run: python3 scripts/test_public_history.py
      - name: Inspect full reachable Git history without revealing values
        run: python3 scripts/check_public_history.py
