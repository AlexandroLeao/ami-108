name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ami_test:ami_test@localhost:5432/ami_test?schema=public
      AMI_TEST_DATABASE_URL: postgresql://ami_test:ami_test@localhost:5432/ami_test?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ami_test
          POSTGRES_PASSWORD: ami_test
          POSTGRES_DB: ami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ami_test -d ami_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe resume diagnostics
        run: |
          bash -n scripts/check-resume-readonly.sh
          bash -n scripts/test-resume-preflight.sh
          bash scripts/test-resume-preflight.sh
      - name: Verify documentation links
        run: |
          python3 scripts/check-doc-links.py
          python3 scripts/test-doc-links.py
      - name: Check private Ollama recovery safety
        run: |
          bash -n scripts/prepare-pinned-local-ollama.sh
          bash -n scripts/test-pinned-ollama-prep.sh
          bash scripts/test-pinned-ollama-prep.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ami-108/api exec prisma validate
      - run: pnpm db:generate
      - run: pnpm --filter @ami-108/api exec prisma migrate deploy
      - run: pnpm --filter @ami-108/api exec prisma migrate status
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/smoke-chapter-one.mjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app tests
      - run: uv run --locked pytest
